name: Compilar APK

# - Cada push a main compila la APK y la deja en Actions → Artifacts (para probar).
# - Para PUBLICAR una versión (la que la app detecta como actualización): Actions → "Compilar APK" →
#   "Run workflow" → marcar "publicar". Crea un Release con la APK firmada y actualiza la versión web
#   (GitHub Pages: https://agusalazar01.github.io/Ingles-progresivo/).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar esta versión como actualización'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Versión
        run: echo "VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Instalar dependencias
        run: npm ci

      - name: Tests
        run: npm test

      - name: Compilar la app web y copiarla al proyecto Android
        run: npm run sync

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar la clave de firma
        if: env.HAS_KEY == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"

      - name: Bajar las librerías de la IA sin internet (sherpa-onnx y piper-phonemize)
        run: |
          mkdir -p android/app/libs
          curl -fsSL --retry 5 -o android/app/libs/sherpa-onnx-2.0.1.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar
          curl -fsSL --retry 5 -o android/app/libs/piper-phonemize-1.5.9.aar https://github.com/csukuangfj/piper-phonemize/releases/download/v1.5.9/piper-phonemize-1.5.9.aar
          ls -lh android/app/libs

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ "$HAS_KEY" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../criollenglish.apk
          else
            echo "::warning::Sin clave de firma: APK de prueba (debug). No se instala encima de versiones firmadas."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../criollenglish.apk
          fi

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v5
        with:
          name: criollenglish-apk
          path: criollenglish.apk

      - name: Publicar versión
        if: github.event_name == 'workflow_dispatch' && inputs.publicar && env.HAS_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}-build${{ github.run_number }}
          name: CriollEnglish ${{ env.VERSION_NAME }} (compilación ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Descargá criollenglish.apk desde el celular e instalala encima de la anterior: se conserva tu progreso.
          files: criollenglish.apk

  # Voces (Piper australiano, Kokoro) y oído (Moonshine) para la llamada con Oliver, listos para que la app
  # los baje una sola vez. Se arman solo la primera vez (si ya existe el Release «modelos-5», no hace nada).
  modelos:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: ¿Ya están preparados?
        id: check
        run: |
          if gh release view modelos-5 >/dev/null 2>&1; then echo "listo=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v6
        if: steps.check.outputs.listo != 'true'
        with:
          python-version: '3.12'

      - name: Preparar los modelos
        if: steps.check.outputs.listo != 'true'
        run: |
          pip install onnx pyyaml
          mkdir -p voces-pocket
          gh release download voces-pocket-prueba --pattern 'ref-*.wav' --dir voces-pocket
          python3 scripts/preparar-modelos.py

      - name: Subirlos al Release «modelos-5»
        if: steps.check.outputs.listo != 'true'
        run: |
          gh release create modelos-5 modelos/* --prerelease --latest=false \
            --title "Modelos de voz para la llamada con Oliver" \
            --notes "Archivos que la app baja una sola vez (Ajustes › Voces e IA). No es una versión de la app."

  web:
    needs: apk
    if: github.event_name == 'workflow_dispatch' && inputs.publicar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Compilar la versión web
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Publicar en GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
