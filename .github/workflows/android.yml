name: Compilar APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tests
        run: npm test

      - name: Compilar la app web y copiarla al proyecto Android
        run: npm run sync

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Compilar APK (debug, instalable directamente)
        working-directory: android
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ingles-progresivo.apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v5
        with:
          name: ingles-progresivo-apk
          path: ingles-progresivo.apk

      - name: Publicar release (solo en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ingles-progresivo.apk
