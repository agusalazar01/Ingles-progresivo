# Arma las 20 voces de Pocket TTS (10 de hombre y 10 de mujer, con varios acentos) a partir de grabaciones
# libres (VCTK y LibriVox) y las deja en el Release «voces-pocket-2», de donde las baja la app.
name: Voces para Pocket TTS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/voces-pocket.py
      - .github/workflows/voces-pocket.yml

permissions:
  contents: write

jobs:
  voces:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Preparar
        run: pip install "datasets>=3" huggingface_hub soundfile librosa noisereduce numpy sherpa-onnx==2.0.1

      - name: Armar las voces
        run: python3 scripts/voces-pocket.py

      - name: Publicar las voces
        run: |
          gh release delete voces-pocket-2 --yes --cleanup-tag 2>/dev/null || true
          gh release create voces-pocket-2 voces-pocket/* --prerelease --latest=false \
            --title "Voces de Pocket TTS (10 de hombre y 10 de mujer)" \
            --notes "Grabaciones de referencia para Pocket TTS: VCTK (CC BY 4.0, versión limpiada por Kyutai) y narradores australianos de LibriVox (dominio público). La app las baja de acá."
